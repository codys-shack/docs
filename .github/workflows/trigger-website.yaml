
name: Signal Website Repo

on:
  push:
    branches:
      - main

jobs:
  ping-website:
    runs-on: ubuntu-latest
    steps:
      - name: Send update signal
        run: |
          curl --fail-with-body -L -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/codys-shack/docs-system/dispatches \
            -d '{"event_type":"docs_updated"}'
