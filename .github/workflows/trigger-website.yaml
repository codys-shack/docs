name: Signal Website Repo

on:
  push:
    branches:
      - main

jobs:
  ping-website:
    runs-on: ubuntu-latest
    steps:
      - name: Send update signal
        run: |
          ORG="codys-shack"
          REPO="docs-system"
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.WEBSITE_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://github.com/${ORG}/${REPO}/dispatches" \
            -d '{"event_type": "docs_updated"}'